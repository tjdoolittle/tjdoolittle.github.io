<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mileage Log</title>
<meta name="description" content="A free business mileage tracker for iPhone: live GPS trips, Google Maps Timeline import, IRS-rate deductions, and CSV export. Your data stays on your phone.">
<meta name="theme-color" content="#0A6A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mileage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;700;800&family=Overpass+Mono:wght@600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: single phone column. Highway guide sign holds the year's odometer and deduction; trip log below grouped by month; fixed action bar at the thumb. */
:root{
  --bg:#ECEFEB; --surface:#FFFFFF; --ink:#18211D; --muted:#5B6862; --line:#D3D9D4;
  --sign:#0A6A4A; --sign-ink:#FFFFFF; --sign-soft:#CFE7DC; --sign-text:#0A6A4A;
  --amber:#C98A07; --amber-bg:#FFF3D6; --danger:#B3261E;
  --odo-bg:#111513; --odo-fg:#F3F3EE; --odo-tenth-bg:#F3F3EE; --odo-tenth-fg:#111513;
  --f-sign:"Overpass", "Highway Gothic", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"Overpass Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#172019; --ink:#E5ECE8; --muted:#94A39B; --line:#29342F;
  --sign:#0D7653; --sign-ink:#FFFFFF; --sign-soft:#B9DCCC; --sign-text:#5FC59A;
  --amber:#F0B43C; --amber-bg:#2E2611; --danger:#F08A82;
  --odo-bg:#050706; --odo-fg:#F3F3EE; --odo-tenth-bg:#F3F3EE; --odo-tenth-fg:#111513;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#172019; --ink:#E5ECE8; --muted:#94A39B; --line:#29342F;
  --sign:#0D7653; --sign-ink:#FFFFFF; --sign-soft:#B9DCCC; --sign-text:#5FC59A;
  --amber:#F0B43C; --amber-bg:#2E2611; --danger:#F08A82;
  --odo-bg:#050706; --odo-fg:#F3F3EE; --odo-tenth-bg:#F3F3EE; --odo-tenth-fg:#111513;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-sign);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.shield{width:22px;height:24px;flex:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.years{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Guide sign */
.sign{background:var(--sign);color:var(--sign-ink);border-radius:14px;padding:6px}
.sign-inner{border:2.5px solid var(--sign-ink);border-radius:10px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:14px}
.sign-label{font-family:var(--f-sign);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sign-btn{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--sign-ink);border-radius:6px;padding:4px 2px;opacity:.95;white-space:nowrap}
.sign-btn:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.sign-btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.rate-list{display:flex;flex-direction:column}
.rate-row{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.rate-row:focus-visible{outline:3px solid var(--amber)}
.rate-row span{flex:1;min-width:0}
.rate-row b{font-family:var(--f-sign);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.rate-edit{border:1.5px solid var(--sign);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.year-list{display:flex;flex-direction:column}
.year-opt{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 6px;border-bottom:1px solid var(--line);font-family:var(--f-sign);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.year-opt[aria-pressed="true"]{color:var(--sign-text)}
.odo{display:flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:clamp(34px,11vw,52px);line-height:1;background:var(--odo-bg);padding:7px;border-radius:8px;width:max-content;max-width:100%;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.odo-cell{height:1em;width:.72em;overflow:hidden;position:relative;background:var(--odo-bg);color:var(--odo-fg);border-radius:3px;text-align:center}
.odo-cell::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 28%,transparent 72%,rgba(0,0,0,.45));pointer-events:none}
.odo-cell.tenth{background:var(--odo-tenth-bg);color:var(--odo-tenth-fg);margin-left:4px}
.odo-strip{display:flex;flex-direction:column;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.odo-strip span{height:1em;line-height:1.02em}
.odo-unit{font-family:var(--f-sign);font-weight:800;font-size:15px;color:var(--odo-fg);padding:0 4px 0 8px;align-self:flex-end;letter-spacing:.06em}
.sign-stats{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,.7fr);gap:10px;border-top:1.5px solid rgba(255,255,255,.35);padding-top:12px}
.stat{min-width:0}
.stat b{display:block;font-family:var(--f-sign);font-weight:800;font-size:clamp(18px,5.4vw,22px);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sign-soft);font-weight:700}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:46px}
.bar{background:rgba(255,255,255,.22);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.bar.now{background:var(--sign-ink)}
.bar-labels{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:10px;font-weight:700;text-align:center;color:var(--sign-soft);margin-top:4px;font-family:var(--f-sign)}

/* Active trip */
.active{background:var(--amber-bg);border:1.5px solid var(--amber);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.active .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.active-text{min-width:0;flex:1}
.active-text strong{display:block;font-family:var(--f-sign);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--amber)}
.active-text span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.active-text .active-detail{white-space:normal;font-size:14px}
.gps-mi{font-family:var(--f-sign);font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Log */
.month{display:flex;flex-direction:column}
.month-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 6px;font-family:var(--f-sign);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);border-bottom:2px solid var(--ink)}
.month-head span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
.trip{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.trip:active{background:var(--surface)}
.d{text-align:center;line-height:1.05}
.d b{display:block;font-family:var(--f-sign);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.d small{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.t-main{min-width:0}
.t-purpose{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-route{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi{font-family:var(--f-sign);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mi small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.rt{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted);vertical-align:2px}

.empty{border:2px dashed var(--line);border-radius:14px;padding:26px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--f-sign);font-weight:800;font-size:19px;color:var(--ink);margin:0;text-wrap:balance}
.empty p{margin:0;max-width:34ch}
.notice{font-size:13px;color:var(--muted);text-align:center}

/* Action bar */
.bar-actions{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar-actions .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{height:52px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-family:var(--f-sign);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.btn.primary{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#1A1405}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.small{height:40px;font-size:14px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:default}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,8,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{margin:0;font-family:var(--f-sign);font-weight:800;font-size:22px;text-wrap:balance}
.close{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-size:16px;width:100%;min-width:0}
.field textarea{height:72px;padding:10px 12px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--sign);outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:40px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--sign)}
.calc{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.calc b{color:var(--ink)}
.err{color:var(--danger);font-size:14px;font-weight:700}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm{border:1.5px solid var(--danger);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.top-actions{display:flex;gap:8px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.imp-sum{font-size:14px;color:var(--muted);margin:0}
.drives{display:flex;flex-direction:column;gap:10px}
.drive{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.drive.on{border-color:var(--sign)}
.drive-head{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.drive-head input{width:22px;height:22px;accent-color:var(--sign);flex:none}
.d-when{flex:1;min-width:0}
.d-when small{font-weight:400;color:var(--muted)}
.d-mi{font-family:var(--f-sign);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.d-route{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.d-fields{display:flex;flex-direction:column;gap:10px}
.link-btn{border:0;background:none;padding:0;color:var(--muted);font-size:13px;font-weight:700;text-decoration:underline;align-self:flex-start}
.maplink{font-size:14px;font-weight:700;color:var(--sign-text);align-self:flex-start}
.imp-foot{position:sticky;bottom:0;background:var(--bg);padding-block:10px 4px;display:flex;flex-direction:column;gap:8px}
textarea.csv{width:100%;height:140px;font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:8px}

@media (prefers-reduced-motion: reduce){.odo-strip,.sheet{transition:none;animation:none}.active .dot{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="shield" viewBox="0 0 22 24" aria-hidden="true"><path d="M11 1.5c3 1.6 6.3 1.8 9.3 1.2.5 6.8-1.2 15.7-9.3 19.8C2.9 18.4 1.2 9.5 1.7 2.7c3 .6 6.3.4 9.3-1.2z" fill="var(--sign)" stroke="var(--ink)" stroke-width="1.4"/><text x="11" y="15.5" text-anchor="middle" font-family="Overpass, sans-serif" font-weight="800" font-size="9" fill="#fff">MI</text></svg>
      Mileage Log
    </div>
    <div class="top-actions">
    <button class="icon-btn" id="btn-import" type="button" aria-label="Import drives from Google Maps">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c-2.5 0-4.5 2-4.5 4.4C3.5 9.3 8 14.5 8 14.5s4.5-5.2 4.5-8.6c0-2.4-2-4.4-4.5-4.4z" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="8" cy="6" r="1.6" fill="currentColor"/></svg>
      Import
    </button>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="Export and settings">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M2.5 13.5h11" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Export
    </button>
    </div>
  </header>

  <div class="years" id="years" role="group" aria-label="Tax year"></div>

  <section class="sign" aria-label="Year summary">
    <div class="sign-inner">
      <div class="sign-label"><button class="sign-btn" type="button" id="sign-year" aria-label="Change tax year">2026 ▾ Business miles</button><button class="sign-btn" type="button" id="sign-rate" aria-label="Change mileage rate"></button></div>
      <div class="odo" id="odo" aria-live="polite"></div>
      <div class="sign-stats">
        <div class="stat"><b id="s-deduct">$0</b><small>Deduction</small></div>
        <div class="stat"><b id="s-month">0</b><small id="s-month-l">This month</small></div>
        <div class="stat"><b id="s-trips">0</b><small>Trips</small></div>
      </div>
      <div>
        <div class="bars" id="bars" aria-hidden="true"></div>
        <div class="bar-labels" aria-hidden="true"><span>J</span><span>F</span><span>M</span><span>A</span><span>M</span><span>J</span><span>J</span><span>A</span><span>S</span><span>O</span><span>N</span><span>D</span></div>
      </div>
    </div>
  </section>

  <div id="active-slot"></div>
  <div id="log"></div>
  <p class="notice" id="notice" hidden></p>
</div>

<nav class="bar-actions" aria-label="Trip actions">
  <div class="in" id="actions"></div>
</nav>

<div id="sheet-slot"></div>
<div id="toast-slot"></div>

<datalist id="dl-places"></datalist>
<datalist id="dl-clients"></datalist>
<datalist id="dl-purposes"></datalist>

<script>
(function(){
"use strict";
// IRS standard business rates. 2026 changed midyear: 72.5¢ through June 30, 76¢ from July 1.
const IRS_RATES = [{from:"2024-01-01",rate:0.67},{from:"2025-01-01",rate:0.70},{from:"2026-01-01",rate:0.725},{from:"2026-07-01",rate:0.76}];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const S = { trips:[], active:null, settings:{rates:{}}, year:new Date().getFullYear(), mode:"loading", readOnly:false };
let backend = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const num = v => { const n=parseFloat(String(v).replace(/,/g,"")); return isFinite(n)?n:null; };
const fmtMi = n => n.toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtUSD = n => n.toLocaleString("en-US",{style:"currency",currency:"USD"});
const newId = () => "t-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// Each rate applies from its start date until the next one starts. settings.ratePeriods overrides the IRS list;
// older backups may carry settings.rates = {year: rate}, which replaces that whole year.
function schedule(){
  const st=S.settings||{};
  let list = Array.isArray(st.ratePeriods) && st.ratePeriods.length ? st.ratePeriods.slice()
    : IRS_RATES.filter(p=>typeof st.rates?.[+p.from.slice(0,4)]!=="number")
        .concat(Object.entries(st.rates||{}).filter(([,r])=>typeof r==="number").map(([y,r])=>({from:y+"-01-01",rate:r})));
  return list.sort((a,b)=>a.from.localeCompare(b.from));
}
function rateOn(date){
  const sch=schedule(); if(!sch.length) return 0.725;
  let r=sch[0].rate; for(const p of sch){ if(p.from<=date) r=p.rate; } return r;
}
const dedOf = t => (+t.miles||0)*rateOn(t.date);
const fmtCents = r => { const c=Math.round(r*1000)/10; return (c%1===0?c.toFixed(0):c.toFixed(1)); };
const longDate = iso => { const d=parseDate(iso); return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); };
const dayBefore = iso => { const d=parseDate(iso); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const parseDate = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };

/* ---------- Storage ---------- */
let persistAsked=false;
function askPersist(){ if(persistAsked) return; persistAsked=true; try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){} }
function localBackend(){
  const KEY="mileage-log-v1"; let listener=null;
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{trips:[],active:null,settings:{rates:{}}}; }catch(e){ return {trips:[],active:null,settings:{rates:{}}}; } };
  const write=d=>{ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} listener&&listener(read()); };
  let mem=read();
  return {
    subscribe(cb){ listener=d=>{mem=d;cb(d)}; cb(mem); },
    async saveTrip(t){ askPersist(); const d=read(); const i=d.trips.findIndex(x=>x.id===t.id); if(i>=0)d.trips[i]=t; else d.trips.push(t); write(d); },
    async deleteTrip(id){ const d=read(); d.trips=d.trips.filter(x=>x.id!==id); write(d); },
    async setActive(a){ const d=read(); d.active=a||null; write(d); },
    async setSettings(s){ const d=read(); d.settings=s; write(d); }
  };
}
async function write(fn){
  try{ await fn(); return true; }
  catch(e){
    if(e && e.code==="invalid_argument"){ S.readOnly=true; render(); toast("This log is view only for you."); }
    else if(e && e.code==="quota_exceeded"){ toast("Storage is full. Delete old trips to add more."); }
    else { toast("Couldn't save. Check your connection and try again."); }
    return false;
  }
}
async function init(){
  backend=localBackend(); S.mode="local";
  backend.subscribe(d=>{ S.trips=d.trips||[]; S.active=d.active||null; S.settings=d.settings||{rates:{}}; render(); });
  if(S.active&&S.active.gps) startGps();
  if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
}

/* ---------- Derived ---------- */
function yearsAvailable(){
  const ys=new Set([new Date().getFullYear()]);
  S.trips.forEach(t=>ys.add(+t.date.slice(0,4)));
  return [...ys].sort((a,b)=>b-a).slice(0,4);
}
function tripsFor(y){ return S.trips.filter(t=>+t.date.slice(0,4)===y).sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0)); }
function suggestions(){
  const places=new Set(),clients=new Set(),purposes=new Set();
  S.trips.forEach(t=>{ t.from&&places.add(t.from); t.to&&places.add(t.to); t.client&&clients.add(t.client); t.purpose&&purposes.add(t.purpose); });
  const fill=(id,set)=>{ $(id).innerHTML=[...set].slice(0,60).map(v=>`<option value="${esc(v)}"></option>`).join(""); };
  fill("dl-places",places); fill("dl-clients",clients); fill("dl-purposes",purposes);
}

/* ---------- Odometer ---------- */
const odoStrips=[];
(function buildOdo(){
  const o=$("odo"); const digits=Array.from({length:10},(_,i)=>`<span>${i}</span>`).join("");
  for(let i=0;i<7;i++){
    const cell=document.createElement("span"); cell.className="odo-cell"+(i===6?" tenth":"");
    const strip=document.createElement("span"); strip.className="odo-strip"; strip.innerHTML=digits;
    cell.appendChild(strip); o.appendChild(cell); odoStrips.push(strip);
  }
  const u=document.createElement("span"); u.className="odo-unit"; u.textContent="MI"; o.appendChild(u);
})();
function setOdo(n){
  const s=Math.min(n,999999.9).toFixed(1).replace(".","").padStart(7,"0");
  s.split("").forEach((c,i)=>{ odoStrips[i].style.transform=`translateY(${-Number(c)}em)`; });
  $("odo").setAttribute("aria-label",fmtMi(n)+" miles");
}

/* ---------- Render ---------- */
function render(){
  const y=S.year, list=tripsFor(y);
  const total=list.reduce((a,t)=>a+(+t.miles||0),0);
  const totalDed=list.reduce((a,t)=>a+dedOf(t),0);
  const now=new Date(), isCur=y===now.getFullYear();
  const rate=rateOn(isCur?todayISO():y+"-12-31");
  const byMonth=Array(12).fill(0); list.forEach(t=>{ byMonth[+t.date.slice(5,7)-1]+=+t.miles||0; });

  $("years").innerHTML=yearsAvailable().map(yr=>`<button class="chip" type="button" data-year="${yr}" aria-pressed="${yr===y}">${yr}</button>`).join("");
  $("sign-year").textContent=y+" ▾ Business miles";
  $("sign-rate").textContent=fmtCents(rate)+"¢ / mi ▾";
  setOdo(total);
  $("s-deduct").textContent=fmtUSD(totalDed);
  if(isCur){ $("s-month").textContent=fmtMi(byMonth[now.getMonth()]); $("s-month-l").textContent=MON[now.getMonth()]+" miles"; }
  else { const avg=total/12; $("s-month").textContent=fmtMi(avg); $("s-month-l").textContent="Avg / month"; }
  $("s-trips").textContent=list.length;
  const max=Math.max(...byMonth,1);
  $("bars").innerHTML=byMonth.map((m,i)=>`<div class="bar${isCur&&i===now.getMonth()?" now":""}" style="height:${Math.max(4,m/max*100)}%" title="${MON[i]}: ${fmtMi(m)} mi"></div>`).join("");

  // Active trip
  renderActive();

  // Log
  if(S.mode==="loading"){ $("log").innerHTML=`<div class="empty"><p>Opening your mileage log…</p></div>`; }
  else if(!list.length){
    $("log").innerHTML=`<div class="empty"><h2>No ${y} trips logged yet</h2><p>Tap <b>Log trip</b> to add a drive you've already made, tap <b>Start trip</b> when you pull out and finish it when you arrive, or tap <b>Import</b> to pull GPS drives from your Google Maps Timeline.</p></div>`;
  } else {
    const groups={}; list.forEach(t=>{ const k=t.date.slice(0,7); (groups[k]=groups[k]||[]).push(t); });
    $("log").innerHTML=Object.keys(groups).sort().reverse().map(k=>{
      const ts=groups[k], sum=ts.reduce((a,t)=>a+(+t.miles||0),0);
      return `<section class="month"><div class="month-head"><span>${MONTHS[+k.slice(5)-1]}</span><span>${fmtMi(sum)} mi · ${fmtUSD(ts.reduce((a,t)=>a+dedOf(t),0))}</span></div>`+
        ts.map(t=>{ const d=parseDate(t.date);
          const route=[t.from,t.to].filter(Boolean).map(esc).join(" → ");
          const sub=[t.client?esc(t.client):"",route].filter(Boolean).join(" · ")||"No route entered";
          return `<button class="trip" type="button" data-trip="${esc(t.id)}"><div class="d"><b>${d.getDate()}</b><small>${DOW[d.getDay()]}</small></div><div class="t-main"><div class="t-purpose">${esc(t.purpose)}${t.roundTrip?'<span class="rt">RT</span>':""}${t.source?'<span class="rt">GPS</span>':""}</div><div class="t-route">${sub}</div></div><div class="mi">${fmtMi(+t.miles)}<small>${fmtUSD(dedOf(t))}</small></div></button>`;
        }).join("")+`</section>`;
    }).join("");
  }

  const n=$("notice");
  n.hidden=false; n.textContent="Trips are saved on this phone only. Back up from Export now and then.";

  const dis=S.mode==="loading"||S.readOnly?"disabled":"";
  $("actions").innerHTML = S.active
    ? `<button class="btn" type="button" data-act="log" ${dis}>Log trip</button><button class="btn amber" type="button" data-act="finish" ${dis}>Finish trip</button>`
    : `<button class="btn" type="button" data-act="start" ${dis}>Start trip</button><button class="btn primary" type="button" data-act="log" ${dis}>+ Log trip</button>`;
  suggestions();
}

function renderActive(){
  const slot=$("active-slot");
  if(!S.active){ slot.innerHTML=""; return; }
  const a=S.active, st=new Date(a.startedAt);
  const since="Since "+st.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+(a.from?" from "+esc(a.from):"");
  let detail=since+(a.odoStart!=null?" · odometer "+esc(a.odoStart):"");
  let big="";
  if(a.gps){
    const mi=(a.meters||0)/1609.344;
    big=`<span class="gps-mi">${fmtMi(mi)} mi</span>`;
    detail=since+" · "+(GPS.status||"GPS on")+(a.gaps?` · ${a.gaps} signal gap${a.gaps>1?"s":""}`:"");
  }
  const existing=slot.querySelector(".active");
  if(existing && existing.dataset.gps===String(!!a.gps)){
    existing.querySelector(".active-detail").innerHTML=detail;
    const g=existing.querySelector(".gps-slot"); if(g) g.innerHTML=big; return;
  }
  slot.innerHTML=`<div class="active" data-gps="${!!a.gps}"><span class="dot" aria-hidden="true"></span><div class="active-text"><strong>${a.gps?"Tracking with GPS":"Trip in progress"}</strong>${a.gps?'<div class="gps-slot">'+big+'</div>':""}<span class="active-detail">${detail}</span></div><button class="btn small" type="button" data-act="cancel-active">Discard</button></div>`;
}

/* ---------- Live GPS ---------- */
const GPS={watch:null,wake:null,status:"",lastSave:0};
async function requestWake(){
  try{ if("wakeLock" in navigator && document.visibilityState==="visible"){ GPS.wake=await navigator.wakeLock.request("screen"); } }catch(e){ GPS.wake=null; }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && GPS.watch!=null) requestWake(); });
function startGps(){
  if(!("geolocation" in navigator)){ GPS.status="GPS not available"; return false; }
  stopGps(true);
  GPS.status="Finding your location…";
  GPS.watch=navigator.geolocation.watchPosition(onFix,onGpsErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  requestWake(); renderActive();
  return true;
}
function stopGps(keepStatus){
  if(GPS.watch!=null){ try{ navigator.geolocation.clearWatch(GPS.watch); }catch(e){} GPS.watch=null; }
  if(GPS.wake){ try{ GPS.wake.release(); }catch(e){} GPS.wake=null; }
  if(!keepStatus) GPS.status="";
}
function onGpsErr(e){
  if(e.code===1){ GPS.status="Location permission denied"; stopGps(true); toast("Allow location for Safari in Settings to track with GPS."); }
  else GPS.status="Weak GPS signal";
  renderActive();
}
function onFix(pos){
  const a=S.active; if(!a||!a.gps) return;
  const c=pos.coords, t=pos.timestamp||Date.now();
  if(c.accuracy>65){ GPS.status=`Weak GPS signal (±${Math.round(c.accuracy)} m)`; renderActive(); return; }
  GPS.status=`GPS on (±${Math.round(c.accuracy)} m)`;
  const p={lat:+c.latitude.toFixed(6),lng:+c.longitude.toFixed(6)};
  if(!a.startPt) a.startPt=p;
  if(a.lastPt){
    const d=meters(a.lastPt,p), dt=(t-a.lastT)/1000;
    if(d<Math.max(8,c.accuracy*0.6)){ renderActive(); return; }   // standing still or jitter
    if(dt>0 && d/dt>70){ renderActive(); return; }                // impossible jump (over 150 mph)
    if(dt>90) a.gaps=(a.gaps||0)+1;                                // screen was off or signal lost
    a.meters=(a.meters||0)+d;
  }
  a.lastPt=p; a.lastT=t; a.endPt=p; a.fixes=(a.fixes||0)+1;
  renderActive();
  if(Date.now()-GPS.lastSave>10000){ GPS.lastSave=Date.now(); backend.setActive(a); }
}

/* ---------- Sheets ---------- */
let sheetCleanup=null;
function closeSheet(){ $("sheet-slot").innerHTML=""; sheetCleanup&&sheetCleanup(); sheetCleanup=null; }
function openSheet(title,body,onMount){
  $("sheet-slot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grip"></div><div class="sheet-head"><h2 id="sheet-title">${title}</h2><button class="close" type="button" id="sheet-close" aria-label="Close">×</button></div>${body}</div></div>`;
  $("sheet-close").onclick=closeSheet;

  const onKey=e=>{ if(e.key==="Escape") closeSheet(); };
  document.addEventListener("keydown",onKey); sheetCleanup=()=>document.removeEventListener("keydown",onKey);
  onMount&&onMount();
}

function wireTripForm(t,onSaved){
  let mode = (t.odoStart!=null && t.odoStart!=="") ? "odo":"miles";
  const calc=()=>{
    let m=null;
    if(mode==="odo"){ const a=num($("f-o1").value), b=num($("f-o2").value); if(a!=null&&b!=null&&b>a) m=Math.round((b-a)*10)/10; }
    else { const v=num($("f-miles").value); if(v!=null&&v>0) m=$("f-rt").checked?v*2:v; }
    const r=rateOn($("f-date").value||todayISO());
    $("f-calc").innerHTML = m ? `<b>${fmtMi(m)} mi</b> × ${fmtCents(r)}¢ = <b>${fmtUSD(m*r)}</b> deduction` : "";
    return m;
  };
  $("f-mode").addEventListener("click",e=>{
    const b=e.target.closest("button[data-mode]"); if(!b) return; mode=b.dataset.mode;
    $("f-mode").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("m-miles").hidden=mode!=="miles"; $("rt-wrap").hidden=mode!=="miles"; $("m-odo").hidden=mode!=="odo"; calc();
  });
  ["f-miles","f-o1","f-o2","f-rt","f-date"].forEach(id=>$(id).addEventListener("input",calc));
  calc();
  const gmap=()=>{ const a=$("f-from").value.trim(), b=$("f-to").value.trim(), l=$("f-gmap");
    l.hidden=!(a&&b); if(a&&b) l.href="https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+encodeURIComponent(a)+"&destination="+encodeURIComponent(b); };
  ["f-from","f-to"].forEach(id=>$(id).addEventListener("input",gmap)); gmap();
  $("trip-form").addEventListener("submit",async e=>{
    e.preventDefault();
    const err=m=>{ $("f-err").textContent=m; $("f-err").hidden=false; };
    const miles=calc(), date=$("f-date").value, purpose=$("f-purpose").value.trim();
    if(!date) return err("Pick the date of the trip.");
    if(!miles){ return err(mode==="odo" ? "Enter both odometer readings, with the end reading higher than the start." : "Enter how many miles you drove."); }
    if(!purpose) return err("Add a business purpose. The IRS requires one for every trip.");
    const trip={
      id:t.id||newId(), date, miles, purpose,
      from:$("f-from").value.trim(), to:$("f-to").value.trim(), client:$("f-client").value.trim(), notes:$("f-notes").value.trim(),
      roundTrip: mode==="miles" && $("f-rt").checked,
      odoStart: mode==="odo"?num($("f-o1").value):null, odoEnd: mode==="odo"?num($("f-o2").value):null,
      createdAt: t.createdAt||Date.now()
    };
    if(t.source) trip.source=t.source;
    if(t.gKey) trip.gKey=t.gKey;
    if(await write(()=>backend.saveTrip(trip))){
      S.year=+date.slice(0,4); closeSheet(); onSaved&&onSaved(trip); toast(`Logged ${fmtMi(miles)} mi`);
    }
  });
  if(t.id){
    $("f-again").onclick=()=>{ const c=Object.assign({},t,{id:null,date:todayISO(),createdAt:null,odoStart:null,odoEnd:null}); if(t.odoStart!=null){ c.miles=t.miles; c.roundTrip=false; } openLog(c); };
    $("f-del").onclick=()=>{
      $("del-slot").innerHTML=`<div class="confirm"><p class="hint">Delete this ${fmtMi(+t.miles)} mi trip from ${esc(t.date)}? This can't be undone.</p><div class="split"><button class="btn small" type="button" id="del-no">Keep it</button><button class="btn small danger" type="button" id="del-yes">Delete trip</button></div></div>`;
      $("del-no").onclick=()=>{ $("del-slot").innerHTML=""; };
      $("del-yes").onclick=async()=>{ if(await write(()=>backend.deleteTrip(t.id))){ closeSheet(); toast("Trip deleted"); } };
    };
  }
}

function openFinish(){
  const a=S.active; if(!a) return;
  IMP.places=(S.settings?.places||[]).slice(); IMP.visits=[];
  const t={ date:a.date, from:a.from, purpose:a.purpose, client:a.client, odoStart:a.odoStart, odoEnd:null };
  if(a.gps){
    const mi=Math.round((a.meters||0)/160.9344)/10;
    if(mi>0){ t.odoStart=null; t.miles=mi; t.source="GPS"; }
    if(!t.from && a.startPt) t.from=labelFor(a.startPt);
    if(a.endPt) t.to=labelFor(a.endPt);
    t.notes=`GPS tracked, ${a.fixes||0} fixes`+(a.gaps?`, ${a.gaps} signal gap${a.gaps>1?"s":""} (straight-line distance used)`:"")+(a.odoStart!=null?`. Odometer start ${a.odoStart}`:"");
  }
  openSheet("Finish trip", tripForm(t,{finishing:true}), ()=>{
    wireTripForm(t, async trip=>{
      stopGps();
      if(a.gps){
        let changed=false;
        [[a.startPt,trip.from],[a.endPt,trip.to]].forEach(([p,name])=>{ if(p&&name&&!isCoord(name)&&!savedPlace(p)){ IMP.places.push({name,lat:p.lat,lng:p.lng}); changed=true; } });
        if(changed){ IMP.hidden=new Set(S.settings?.hidden||[]); await persistImportSettings(); }
      }
      write(()=>backend.setActive(null));
    });
    setTimeout(()=>{ const f=t.miles?$("f-to"):(a.odoStart!=null?$("f-o2"):$("f-miles")); f&&f.focus(); },250);
  });
}

function csvFor(y){
  const q=v=>{ const s=String(v??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=[["Date","From","To","Business purpose","Client","Odometer start","Odometer end","Round trip","Miles","Rate per mile","Deduction","Notes","Source"]];
  const list=tripsFor(y).slice().reverse(); let tot=0, totDed=0;
  list.forEach(t=>{ const r=rateOn(t.date), d=Math.round(t.miles*r*100)/100; tot+=+t.miles; totDed+=d;
    rows.push([t.date,t.from,t.to,t.purpose,t.client,t.odoStart??"",t.odoEnd??"",t.roundTrip?"Yes":"",(+t.miles).toFixed(1),r.toFixed(3),d.toFixed(2),t.notes,t.source||"Manual"]); });
  rows.push(["Total","","","","","","","",tot.toFixed(1),"",totDed.toFixed(2),"",""]);
  return rows.map(r=>r.map(q).join(",")).join("\n");
}

function openSettings(){
  const y=S.year, count=tripsFor(y).length;
  openSheet(`${y} export & rates`,`
    <div style="display:flex;flex-direction:column;gap:14px">
      <button class="btn primary" type="button" id="x-csv" ${count?"":"disabled"}>Export ${y} as CSV (${count} trips)</button>
      <div id="x-fallback"></div>
      <p class="hint">The CSV includes date, route, purpose, miles, and the rate used for every trip: the records the IRS asks you to keep.</p>
      <div class="field"><span class="lbl">Mileage rates</span><p class="hint">Each rate applies from its start date until the next one starts. Every trip uses the rate in effect on the day it was driven. Tap a rate to change it.</p></div>
      <div id="x-rates"></div>
      <div class="field"><span class="lbl">Backup</span><p class="hint">Trips live only on this phone. Save a backup to Files or iCloud Drive, and restore it on a new phone.</p></div>
      <div class="split"><button class="btn small" type="button" id="x-backup">Save backup</button><span class="btn small file-btn" role="button">Restore<input id="x-restore" type="file" accept=".json,application/json" aria-label="Restore from backup"></span></div>
      <p class="hint" id="x-restore-msg" hidden></p>
    </div>`, ()=>{
      $("x-backup").onclick=()=>{ const d={app:"mileage-log",version:1,exportedAt:new Date().toISOString(),trips:S.trips,settings:S.settings}; saveFile(`mileage-log-backup-${todayISO()}.json`,JSON.stringify(d,null,1),"application/json"); };
      $("x-restore").addEventListener("change",async e=>{
        const f=e.target.files[0]; if(!f) return; const msg=$("x-restore-msg");
        try{
          const d=JSON.parse(await f.text()); if(d.app!=="mileage-log"||!Array.isArray(d.trips)) throw 0;
          const have=new Set(S.trips.map(t=>t.id)); let added=0;
          for(const t of d.trips){ if(t&&t.id&&t.date&&!have.has(t.id)){ await backend.saveTrip(t); added++; } }
          if(d.settings) await backend.setSettings(Object.assign({},d.settings,S.settings,{rates:Object.assign({},d.settings.rates||{},S.settings?.rates||{}),ratePeriods:S.settings?.ratePeriods||d.settings.ratePeriods||undefined}));
          msg.textContent=`Restored ${added} trip${added===1?"":"s"}. ${d.trips.length-added} were already here.`; msg.hidden=false;
        }catch(err){ msg.textContent="That file isn't a Mileage Log backup."; msg.hidden=false; }
      });
      $("x-csv").onclick=async()=>{
        const data=csvFor(y), name=`mileage-log-${y}.csv`;
        if(await saveFile(name,data,"text/csv")) return;
        $("x-fallback").innerHTML=`<p class="hint">This browser blocked the download. Copy the CSV and paste it into Numbers, Excel, or a note.</p><textarea class="csv" id="x-text" readonly>${esc(data)}</textarea><button class="btn small" type="button" id="x-copy">Copy CSV</button>`;
        $("x-copy").onclick=()=>{ const ta=$("x-text"); navigator.clipboard.writeText(data).then(()=>toast("CSV copied"),()=>{ ta.focus(); ta.select(); toast("Selected. Use Copy from the menu."); }); };
      };
      renderRates();
    });
}

function saveSchedule(list){
  const seen=new Set(), clean=list.filter(p=>p&&p.from&&!seen.has(p.from)&&seen.add(p.from)).sort((a,b)=>a.from.localeCompare(b.from));
  const st=Object.assign({},S.settings||{}); st.rates={};
  if(clean.length) st.ratePeriods=clean; else delete st.ratePeriods;
  return write(()=>backend.setSettings(st));
}
function renderRates(editFrom){
  const box=$("x-rates"); if(!box) return;
  const sch=schedule(), custom=Array.isArray(S.settings?.ratePeriods)||Object.keys(S.settings?.rates||{}).length>0;
  const rows=sch.map((p,i)=>{ const next=sch[i+1]; return {p,range: next?`${longDate(p.from)} to ${longDate(dayBefore(next.from))}`:`${longDate(p.from)} onward`}; }).reverse();
  const editing = editFrom===undefined ? null : (editFrom==="new" ? {from:todayISO(),rate:null,isNew:true} : sch.find(p=>p.from===editFrom));
  box.innerHTML=`<div class="rate-list">${rows.map(({p,range})=>
      editing&&!editing.isNew&&editing.from===p.from ? editorHtml(editing,sch.length>1)
      : `<button class="rate-row" type="button" data-rate="${p.from}" ${S.readOnly?"disabled":""}><span>${range}</span><b>${fmtCents(p.rate)}¢</b></button>`).join("")}</div>
    ${editing&&editing.isNew?editorHtml(editing,false):""}
    <div class="split" style="margin-top:10px"><button class="btn small" type="button" id="r-add" ${S.readOnly||editing?"disabled":""}>Add rate change</button>${custom?`<button class="btn small" type="button" id="r-irs" ${S.readOnly?"disabled":""}>Use IRS rates</button>`:"<span></span>"}</div>
    <p class="hint" style="margin-top:8px">IRS business rate for 2026: 72.5¢ through June 30, then 76¢ from July 1 through December 31.</p>`;
  box.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>renderRates(b.dataset.rate));
  const add=$("r-add"); if(add) add.onclick=()=>renderRates("new");
  const irs=$("r-irs"); if(irs) irs.onclick=async()=>{ const st=Object.assign({},S.settings||{}); delete st.ratePeriods; st.rates={}; if(await write(()=>backend.setSettings(st))){ toast("Using the IRS rates"); renderRates(); render(); } };
  if(!editing) return;
  $("r-cancel").onclick=()=>renderRates();
  const del=$("r-del"); if(del) del.onclick=async()=>{ if(await saveSchedule(sch.filter(p=>p.from!==editing.from))){ toast("Rate removed"); renderRates(); render(); } };
  $("r-save").onclick=async()=>{
    const from=$("r-from").value, c=num(String($("r-cents").value).replace("¢",""));
    if(!/^\d{4}-\d{2}-\d{2}$/.test(from)){ $("r-err").textContent="Pick the date this rate starts."; $("r-err").hidden=false; return; }
    if(c==null||c<=0||c>500){ $("r-err").textContent="Enter the rate in cents per mile, like 76."; $("r-err").hidden=false; return; }
    const next=sch.filter(p=>p.from!==editing.from&&p.from!==from).concat([{from,rate:Math.round(c*10)/1000}]);
    if(await saveSchedule(next)){ toast(`Rate saved. Trips from ${longDate(from)} on use ${fmtCents(Math.round(c*10)/1000)}¢.`); renderRates(); render(); }
  };
  setTimeout(()=>{ const f=$("r-cents"); f&&f.focus(); },50);
}
function editorHtml(e,canDelete){
  return `<div class="rate-edit">
    <div class="row"><div class="field"><label for="r-from">Starts on</label><input id="r-from" type="date" value="${esc(e.from)}"></div>
    <div class="field"><label for="r-cents">Cents per mile</label><input id="r-cents" inputmode="decimal" placeholder="76" value="${e.rate!=null?fmtCents(e.rate):""}"></div></div>
    <p class="err" id="r-err" role="alert" hidden></p>
    <div class="split"><button class="btn small" type="button" id="r-cancel">Cancel</button><button class="btn small primary" type="button" id="r-save">Save rate</button></div>
    ${!e.isNew&&canDelete?`<button class="btn small danger" type="button" id="r-del">Remove this rate</button>`:""}
  </div>`;
}

/* ---------- Year picker ---------- */
function openYearPicker(){
  const cur=new Date().getFullYear(), ys=new Set();
  for(let y=cur+1;y>=cur-4;y--) ys.add(y);
  S.trips.forEach(t=>ys.add(+t.date.slice(0,4)));
  const list=[...ys].filter(y=>y>2000).sort((a,b)=>b-a);
  openSheet("Tax year",`<div class="year-list">${list.map(y=>{ const n=tripsFor(y).length;
    return `<button class="year-opt" type="button" data-pick-year="${y}" aria-pressed="${y===S.year}"><span>${y}</span><small class="hint">${n?n+" trip"+(n>1?"s":""):""}${y===S.year?" ✓":""}</small></button>`; }).join("")}</div>`,()=>{
    document.querySelectorAll("[data-pick-year]").forEach(b=>b.onclick=()=>{ S.year=+b.dataset.pickYear; closeSheet(); render(); });
  });
}

/* ---------- Google Maps Timeline import ---------- */
const VEH=/vehicle|driving|drive|car|motor|taxi/i;
const IMP={drives:[],visits:[],shown:25,places:[],hidden:new Set()};
let settingsChain=Promise.resolve();
function ll(v){
  if(!v) return null;
  if(typeof v==="object"){
    if(v.latitudeE7!=null) return {lat:v.latitudeE7/1e7,lng:v.longitudeE7/1e7};
    if(v.latLng) return ll(v.latLng);
    if(v.lat!=null) return {lat:+v.lat,lng:+v.lng};
    return null;
  }
  const m=String(v).replace(/geo:|°/g,"").split(",").map(s=>parseFloat(s));
  return (m.length===2&&isFinite(m[0])&&isFinite(m[1]))?{lat:m[0],lng:m[1]}:null;
}
const semLabel=t=>{ t=String(t||"").toLowerCase(); return t==="home"?"Home":t==="work"?"Work":""; };
function legacyTime(d,which){ if(!d) return null; const iso=d[which+"Timestamp"], ms=d[which+"TimestampMs"]; return iso?new Date(iso):ms?new Date(+ms):null; }
function parseTimeline(json,out){
  const segs=Array.isArray(json)?json:(json.semanticSegments||null);
  if(segs){
    segs.forEach(s=>{
      const st=s.startTime?new Date(s.startTime):null, en=s.endTime?new Date(s.endTime):null;
      if(s.activity){ const a=s.activity, type=a.topCandidate?.type||"";
        if(VEH.test(type)) out.drives.push({start:st,end:en,s:ll(a.start),e:ll(a.end),meters:+a.distanceMeters||0}); }
      else if(s.visit){ const c=s.visit.topCandidate||{}, p=ll(c.placeLocation); if(p) out.visits.push(Object.assign({label:semLabel(c.semanticType)},p)); }
    });
    return true;
  }
  if(json.timelineObjects){
    json.timelineObjects.forEach(o=>{
      if(o.activitySegment){ const a=o.activitySegment;
        if(VEH.test(a.activityType||"")) out.drives.push({start:legacyTime(a.duration,"start"),end:legacyTime(a.duration,"end"),s:ll(a.startLocation),e:ll(a.endLocation),meters:+a.distance||0}); }
      else if(o.placeVisit){ const l=o.placeVisit.location||{}, p=ll(l); if(p) out.visits.push(Object.assign({label:l.name||semLabel(l.semanticType)||""},p)); }
    });
    return true;
  }
  return false;
}
function meters(a,b){ const R=6371000,r=x=>x*Math.PI/180, dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const coordLabel=p=>p.lat.toFixed(4)+", "+p.lng.toFixed(4);
const isCoord=s=>/^-?\d+\.\d+,\s*-?\d+\.\d+$/.test(s.trim());
function savedPlace(p){ if(!p) return null; return IMP.places.find(pl=>meters(p,pl)<200)||null; }
function labelFor(p){
  if(!p) return "";
  const sp=savedPlace(p); if(sp) return sp.name;
  let best="",bd=400; IMP.visits.forEach(v=>{ if(!v.label) return; const d=meters(p,v); if(d<bd){bd=d;best=v.label;} });
  return best||coordLabel(p);
}
const dKey=d=>"g"+d.start.getTime();
function pendingDrives(){
  const logged=new Set(S.trips.map(t=>t.gKey).filter(Boolean));
  return IMP.drives.filter(d=>!logged.has(dKey(d))&&!IMP.hidden.has(dKey(d)));
}
function persistImportSettings(){
  settingsChain=settingsChain.then(()=>write(()=>backend.setSettings(Object.assign({},S.settings||{},{places:IMP.places.slice(-300),hidden:[...IMP.hidden].slice(-3000)}))));
  return settingsChain;
}

function openImport(){
  IMP.places=(S.settings?.places||[]).slice(); IMP.hidden=new Set(S.settings?.hidden||[]);
  openSheet("Import from Google Maps",`
    <ol class="steps">
      <li>Open Google Maps, tap your profile picture, then <b>Your Timeline</b>.</li>
      <li>Tap <b>⋯</b>, then <b>Location &amp; privacy settings</b>, then <b>Export Timeline data</b>.</li>
      <li>Save the file to Files, then choose it below.</li>
    </ol>
    <p class="hint">Only drives in a car come in. The file is read on this phone and never uploaded.</p>
    <span class="btn primary file-btn" role="button">Choose Timeline file<input id="imp-file" type="file" accept=".json,application/json" multiple aria-label="Choose Timeline file"></span>
    <div id="imp-body"></div>`, ()=>{
      $("imp-file").addEventListener("change",async e=>{
        const files=[...e.target.files]; if(!files.length) return;
        $("imp-body").innerHTML=`<p class="imp-sum">Reading ${files.length>1?files.length+" files":esc(files[0].name)}…</p>`;
        const out={drives:[],visits:[]}; let ok=0;
        for(const f of files){ try{ if(parseTimeline(JSON.parse(await f.text()),out)) ok++; }catch(err){} }
        if(!ok){ $("imp-body").innerHTML=`<p class="err">That file doesn't look like a Google Maps Timeline export. Pick the .json file from Export Timeline data.</p>`; return; }
        const seen=new Set();
        IMP.drives=out.drives.filter(d=>d.start&&!isNaN(d.start)&&d.meters>=160&&!seen.has(dKey(d))&&seen.add(dKey(d))).sort((a,b)=>b.start-a.start);
        IMP.visits=out.visits; IMP.shown=25;
        renderImport();
      });
    });
}

function renderImport(){
  const body=$("imp-body"); if(!body) return;
  const list=pendingDrives(), show=list.slice(0,IMP.shown);
  if(!IMP.drives.length){ body.innerHTML=`<p class="imp-sum">No car drives found in this file. Check that Timeline was on while you drove.</p>`; return; }
  if(!list.length){ body.innerHTML=`<p class="imp-sum">All ${IMP.drives.length} drives in this file are already logged or hidden.</p>`; return; }
  body.innerHTML=`<p class="imp-sum">${list.length} drive${list.length>1?"s":""} not yet logged. Check the business ones.</p>
    <div class="drives">${show.map((d,i)=>{
      const k=dKey(d), mi=Math.round(d.meters/160.9344)/10, from=labelFor(d.s), to=labelFor(d.e);
      return `<div class="drive" data-k="${k}" data-i="${i}">
        <label class="drive-head"><input type="checkbox" class="d-chk"><span class="d-when">${DOW[d.start.getDay()]} ${MON[d.start.getMonth()]} ${d.start.getDate()}${d.start.getFullYear()!==new Date().getFullYear()?", "+d.start.getFullYear():""} <small>${d.start.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</small></span><span class="d-mi">${fmtMi(mi)} mi</span></label>
        <div class="d-route">${esc(from)} → ${esc(to)}</div>
        <div class="d-fields" hidden>
          <div class="row"><div class="field"><label for="i-from-${i}">From</label><input id="i-from-${i}" list="dl-places" autocomplete="off" value="${esc(from)}"></div>
          <div class="field"><label for="i-to-${i}">To</label><input id="i-to-${i}" list="dl-places" autocomplete="off" value="${esc(to)}"></div></div>
          <div class="field"><label for="i-pur-${i}">Business purpose</label><input id="i-pur-${i}" list="dl-purposes" autocomplete="off" placeholder="Service call"></div>
          <div class="field"><label for="i-cli-${i}">Client or job</label><input id="i-cli-${i}" list="dl-clients" autocomplete="off" placeholder="Optional"></div>
        </div>
        <button class="link-btn d-hide" type="button">Personal drive, hide it</button>
      </div>`; }).join("")}</div>
    ${list.length>show.length?`<button class="btn small" type="button" id="imp-more">Show ${Math.min(25,list.length-show.length)} more</button>`:""}
    <div class="imp-foot"><p class="err" id="imp-err" hidden></p><button class="btn primary" type="button" id="imp-save" disabled>Log selected trips</button></div>`;
  const count=()=>{ const n=body.querySelectorAll(".d-chk:checked").length; $("imp-save").disabled=!n||S.readOnly; $("imp-save").textContent=n?`Log ${n} trip${n>1?"s":""}`:"Log selected trips"; };
  body.querySelectorAll(".drive").forEach(el=>{
    el.querySelector(".d-chk").addEventListener("change",e=>{ el.classList.toggle("on",e.target.checked); el.querySelector(".d-fields").hidden=!e.target.checked; el.querySelector(".d-route").hidden=e.target.checked; count(); });
    el.querySelector(".d-hide").onclick=()=>{ IMP.hidden.add(el.dataset.k); persistImportSettings(); renderImport(); };
  });
  const more=$("imp-more"); if(more) more.onclick=()=>{ IMP.shown+=25; renderImport(); };
  $("imp-save").onclick=async()=>{
    const picked=[...body.querySelectorAll(".drive.on")], err=$("imp-err");
    const missing=picked.filter(el=>!$("i-pur-"+el.dataset.i).value.trim());
    if(missing.length){ err.textContent=`Add a business purpose to ${missing.length===1?"the checked trip":"all "+missing.length+" checked trips"}.`; err.hidden=false; $("i-pur-"+missing[0].dataset.i).focus(); return; }
    err.hidden=true; $("imp-save").disabled=true; $("imp-save").textContent="Saving…";
    const byKey=new Map(show.map(d=>[dKey(d),d])); let saved=0, placesChanged=false;
    for(const el of picked){
      const d=byKey.get(el.dataset.k), i=el.dataset.i, mi=Math.round(d.meters/160.9344)/10;
      const from=$("i-from-"+i).value.trim(), to=$("i-to-"+i).value.trim();
      [[d.s,from],[d.e,to]].forEach(([p,name])=>{ if(p&&name&&!isCoord(name)&&!savedPlace(p)){ IMP.places.push({name,lat:+p.lat.toFixed(5),lng:+p.lng.toFixed(5)}); placesChanged=true; } });
      const dt=d.start;
      const trip={ id:newId(), date:dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate()), miles:mi,
        purpose:$("i-pur-"+i).value.trim(), client:$("i-cli-"+i).value.trim(), from, to, notes:"",
        roundTrip:false, odoStart:null, odoEnd:null, createdAt:Date.now(), source:"Google Maps", gKey:el.dataset.k,
        startTime:dt.toISOString(), endTime:d.end&&!isNaN(d.end)?d.end.toISOString():null };
      if(await write(()=>backend.saveTrip(trip))) saved++; else break;
    }
    if(placesChanged) await persistImportSettings();
    if(saved) toast(`Logged ${saved} trip${saved>1?"s":""} from Google Maps`);
    if(pendingDrives().length && $("imp-body")) renderImport(); else closeSheet();
  };
}

async function saveFile(name,data,type){
  try{
    const blob=new Blob([data],{type});
    const file=new File([blob],name,{type});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod/.test(navigator.userAgent)){
      try{ await navigator.share({files:[file],title:name}); return true; }catch(e){ if(e&&e.name==="AbortError") return true; }
    }
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Saved "+name); return true;
  }catch(e){ return false; }
}

/* ---------- Events ---------- */
let toastT=null;
function toast(msg){ $("toast-slot").innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>{$("toast-slot").innerHTML="";},2600); }

document.addEventListener("click",async e=>{
  const yb=e.target.closest("[data-year]"); if(yb){ S.year=+yb.dataset.year; render(); return; }
  const tb=e.target.closest("[data-trip]"); if(tb){ const t=S.trips.find(x=>x.id===tb.dataset.trip); if(t&&!S.readOnly) openLog(t); return; }
  const ab=e.target.closest("[data-act]"); if(!ab) return;
  const act=ab.dataset.act;
  if(act==="log") openLog();
  else if(act==="start") openStart();
  else if(act==="finish") openFinish();
  else if(act==="cancel-active"){
    if(ab.dataset.armed){ stopGps(); if(await write(()=>backend.setActive(null))) toast("Trip discarded"); }
    else { ab.dataset.armed="1"; ab.textContent="Tap to confirm"; setTimeout(()=>{ if(ab.isConnected){ delete ab.dataset.armed; ab.textContent="Discard"; } },3000); }
  }
});
$("btn-settings").onclick=openSettings;
$("sign-year").onclick=openYearPicker;
$("sign-rate").onclick=openSettings;
$("btn-import").onclick=()=>{ if(S.mode==="loading"){ toast("Still opening your log. Try again in a moment."); return; } openImport(); };

init();
})();
</script>
