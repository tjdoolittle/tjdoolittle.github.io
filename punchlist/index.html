<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EHT Punchlist</title>
<meta name="theme-color" content="#1a5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Punchlist">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#11141a;--mute:#5b6372;--line:#dde2ea;--blue:#1a5cff;--blue2:#e6edff;--done:#8b93a3}
@media(prefers-color-scheme:dark){:root{--bg:#0d1017;--card:#171b24;--ink:#eef1f6;--mute:#9aa3b4;--line:#2a303c;--blue2:#1b2742;--done:#6b7385}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{background:var(--blue);color:#fff;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 18px calc(16px + env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:clamp(30px,7vw,44px);line-height:1.05;margin:2px 0 4px;font-weight:800}
.sub{opacity:.85;font-size:15px}
.nav{margin-left:auto;display:flex;gap:6px}
button{font:inherit;cursor:pointer}
.nav button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;min-width:44px;height:44px;font-weight:600;font-size:15px;padding:0 12px}
.crew{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;font-size:14px}
main{padding:16px calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:none;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:15px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{margin:14px 0 6px;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--mute)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
.ticket{background:var(--card);border-radius:16px;margin-top:14px;display:grid;grid-template-columns:84px 1fr;border:1px solid var(--line);overflow:hidden}
.when{background:var(--blue2);padding:16px 8px;text-align:center;border-right:2px dashed var(--line)}
.time{font-size:20px;font-weight:800;line-height:1.1;white-space:nowrap}
.small{font-size:13px;color:var(--mute);font-weight:600}
.tech{display:inline-block;margin-top:8px;font-weight:700;font-size:13px;background:var(--ink);color:var(--card);border-radius:6px;padding:2px 7px}
.body{padding:14px 14px 8px}
h2{font-size:20px;margin:0;line-height:1.2}
.meta{font-size:14px;color:var(--mute);margin:4px 0 8px;display:flex;flex-direction:column;gap:2px}
.meta a{color:var(--blue);text-decoration:none;font-weight:500}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--mute);border-radius:7px;display:grid;place-content:center}
.task input:checked{background:var(--blue);border-color:var(--blue)}
.task input:checked::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task input:checked+span{color:var(--done);text-decoration:line-through}
.sum{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.sum span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.sum b{color:var(--ink)}
.by{display:block;font-size:12px;color:var(--mute)}
h3{font-size:15px;margin:26px 0 0;color:var(--mute)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;margin-top:14px;color:var(--mute)}
.foot{margin-top:28px;display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px}
.foot button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;height:40px;padding:0 14px}
/* PIN screen */
#lock{position:fixed;inset:0;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;text-align:center}
#lock[hidden]{display:none}
#lock h1{margin:0}
.dots{display:flex;gap:14px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:28px;font-weight:600}
.pad button:active{background:rgba(255,255,255,.32)}
#pinmsg{min-height:24px;font-size:15px;opacity:.9}
button:focus-visible{outline:3px solid #9fbcff;outline-offset:2px}
</style>
</head>
<body>
<div id="lock">
  <h1>Punchlist</h1>
  <div>Enter your 4-digit PIN</div>
  <div class="dots" id="dots"></div>
  <div id="pinmsg"></div>
  <div class="pad" id="pad"></div>
</div>

<header class="top"><div class="wrap">
  <div class="row">
    <div><div class="sub" id="dow">Loading</div><h1 id="date">Punchlist</h1></div>
    <div class="nav"><button id="prev" aria-label="Previous day">‹</button><button id="today">Today</button><button id="next" aria-label="Next day">›</button></div>
  </div>
  <div class="crew" id="crew"></div>
</div></header>
<main><div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="prog"><div class="bar"><i id="fill"></i></div><span id="count"></span></div>
  <div class="sum" id="sum"></div>
  <div id="list"></div>
  <div id="left"></div>
  <div class="foot"><span id="who"></span><button id="out">Sign out</button></div>
</div></main>

<script>
{
// Paste your Apps Script web app URL here (Deploy > Manage deployments > Web app URL, ends in /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbwFjuC6stc3Xk12tE3y9UGtMXJOeigqt3jgWx3QdkzA-MFRHJUH3anAzfbCGRkUjaL0/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parse = s => { const p = s.split('-'); return new Date(+p[0], p[1] - 1, +p[2]); };
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

let pin = store.get('pl-pin') || '', me = null, techs = [], tech = 'ALL', day = iso(new Date()), data = null, entry = '';

async function api(body){
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin }, body)) });
  const j = await r.json();
  if (j.error === 'bad_pin' || j.error === 'locked') { signOut(j.message); throw new Error(j.message); }
  if (j.error) throw new Error(j.message || j.error);
  return j;
}

// ----- PIN screen -----
$('pad').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k => k ? `<button data-k="${k}" aria-label="${k === '⌫' ? 'Delete' : k}">${k}</button>` : '<span></span>').join('');
function dots(){ $('dots').innerHTML = Array.from({ length: 4 }, (_, i) => `<i class="${i < entry.length ? 'f' : ''}"></i>`).join(''); }
$('pad').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.k;
  if (k === '⌫') entry = entry.slice(0, -1); else if (entry.length < 4) entry += k;
  dots();
  if (entry.length === 4) { pin = entry; entry = ''; $('pinmsg').textContent = 'Checking…'; hello(); }
};
document.addEventListener('keydown', e => {
  if ($('lock').hidden) return;
  if (/^\d$/.test(e.key)) $('pad').querySelector(`[data-k="${e.key}"]`).click();
  if (e.key === 'Backspace') $('pad').querySelector('[data-k="⌫"]').click();
});
function signOut(msg){
  pin = ''; store.del('pl-pin'); me = null; data = null;
  try { Object.keys(localStorage).filter(k => k.startsWith('pl-day-')).forEach(k => localStorage.removeItem(k)); } catch(e){}
  $('lock').hidden = false; entry = ''; dots(); $('pinmsg').textContent = msg || '';
}
$('out').onclick = () => signOut('');

async function hello(){
  try {
    const r = await api({ action: 'hello' });
    me = r; techs = r.techs; store.set('pl-pin', pin);
    tech = store.get('pl-tab') || r.tech;
    $('lock').hidden = true; $('pinmsg').textContent = '';
    $('who').textContent = 'Signed in as ' + r.name;
    load();
  } catch (err) {
    if (!$('lock').hidden) { $('pinmsg').textContent = err.message || 'Could not connect. Check your signal.'; dots(); }
    else { $('who').textContent = 'Offline. Showing saved list.'; load(); }
  }
}

// ----- List -----
function shift(n){ const d = parse(day); do { d.setDate(d.getDate() + n); } while (d.getDay() === 0 || d.getDay() === 6); day = iso(d); load(); }
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
$('today').onclick = () => { day = iso(new Date()); load(); };

async function load(){
  const d = parse(day);
  $('dow').textContent = d.toLocaleDateString('en-US', { weekday: 'long' });
  $('date').textContent = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  const cached = store.get('pl-day-' + day);
  if (cached) { try { data = JSON.parse(cached); render(); } catch(e){} }
  else { data = null; $('crew').innerHTML = ''; $('left').innerHTML = ''; $('list').innerHTML = '<div class="empty">Loading the calendar…</div>'; renderTabs(); }
  const asked = day;
  try {
    const res = await api({ action: 'day', date: asked });
    if (asked !== day) return;
    data = res; store.set('pl-day-' + asked, JSON.stringify(res)); render();
  } catch (err) {
    if (asked === day && !cached) $('list').innerHTML = `<div class="empty">Couldn't load: ${esc(err.message)}</div>`;
  }
}

const techName = code => code === 'ALL' ? 'Crew' : ((techs.find(t => t.code === code) || {}).name || code);
const mine = j => tech === 'ALL' || j.tech === tech || j.tech === 'ALL';

function ticket(j, date, showTime){
  const m = (j.time || '').match(/^(\d{1,2}:\d{2})\s*(AM|PM)$/i);
  const when = showTime
    ? (m ? `<div class="time">${esc(m[1])}</div><div class="small">${esc(m[2])}</div>` : '<div class="time">Any</div><div class="small">time</div>')
    : `<div class="small">${esc(parse(date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }))}</div>`;
  let meta = '';
  if (j.client !== j.title) meta += `<span>${esc(j.title)}</span>`;
  if (j.location) meta += `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.location)}" target="_blank" rel="noopener">${esc(j.location)}</a>`;
  if (j.phone) meta += `<span>${esc(j.phone)} · <a href="tel:${esc(j.phone.replace(/[^\d+]/g, ''))}">Call</a></span>`;
  const rows = j.tasks.map(t => `<label class="task"><input type="checkbox" ${t.done ? 'checked' : ''} data-date="${esc(date)}" data-event="${esc(j.eventId)}" data-task="${esc(t.id)}"><span>${esc(t.text)}${t.done && t.by ? `<small class="by">${esc(String(t.by).split('@')[0])}</small>` : ''}</span></label>`).join('');
  return `<article class="ticket"><div class="when">${when}<div class="tech">${esc(techName(j.tech))}</div></div><div class="body"><h2>${esc(j.client)}</h2><div class="meta">${meta}</div>${rows}</div></article>`;
}

function renderTabs(){
  $('tabs').innerHTML = [{ code: 'ALL', name: 'Everyone' }].concat(techs).map(t => `<button data-t="${esc(t.code)}" class="${t.code === tech ? 'on' : ''}">${esc(t.name)}</button>`).join('');
}
function progress(){
  let done = 0, total = 0;
  data.jobs.filter(mine).forEach(j => j.tasks.forEach(t => { total++; if (t.done) done++; }));
  $('fill').style.width = (total ? done / total * 100 : 0) + '%';
  $('count').textContent = `${done} of ${total} done`;
  // Crew summary on the Everyone tab
  $('sum').innerHTML = tech !== 'ALL' ? '' : techs.map(t => {
    let d = 0, n = 0;
    data.jobs.filter(j => j.tech === t.code).forEach(j => j.tasks.forEach(x => { n++; if (x.done) d++; }));
    return n ? `<span><b>${esc(t.name)}</b> ${d}/${n}</span>` : '';
  }).join('');
}
function render(){
  renderTabs();
  if (!data) return;
  $('crew').innerHTML = data.crew.map(c => `<span class="chip">${esc(c)}</span>`).join('');
  const jobs = data.jobs.filter(mine);
  $('list').innerHTML = jobs.length ? jobs.map(j => ticket(j, data.date, true)).join('')
    : `<div class="empty">Nothing on the calendar for ${esc(tech === 'ALL' ? 'the crew' : techName(tech))} this day.</div>`;
  progress();
  const left = data.leftover.filter(mine);
  $('left').innerHTML = left.length ? `<h3>Still open from ${esc(parse(data.prevDate).toLocaleDateString('en-US', { weekday: 'long' }))}</h3>` + left.map(j => ticket(j, data.prevDate, false)).join('') : '';
}
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; tech = b.dataset.t; store.set('pl-tab', tech); render(); };

document.addEventListener('change', async e => {
  const c = e.target; if (!c.matches('.task input') || !data) return;
  const list = c.dataset.date === data.date ? data.jobs : data.leftover;
  const job = list.find(j => j.eventId === c.dataset.event);
  const task = job && job.tasks.find(t => t.id === c.dataset.task);
  if (!task) return;
  task.done = c.checked; progress();
  try {
    await api({ action: 'check', check: { date: c.dataset.date, eventId: job.eventId, taskId: task.id, text: task.text, client: job.client, tech: job.tech, done: c.checked } });
    store.set('pl-day-' + data.date, JSON.stringify(data));
  } catch (err) {
    c.checked = !c.checked; task.done = c.checked; progress();
    $('count').textContent = 'That check did not save. Try again.';
  }
});

// Refresh when the app comes back to the front.
document.addEventListener('visibilitychange', () => { if (!document.hidden && me) load(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

dots();
if (API_URL.indexOf('/exec') < 0) { $('pinmsg').textContent = 'Setup needed: paste the Apps Script URL into index.html.'; }
else if (pin) { $('lock').hidden = true; hello(); }
}
</script>
</body>
</html>
